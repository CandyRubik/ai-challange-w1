<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Чат с автоматической компактизацией контекста" />
    <title>Rubik Chat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <a class="brand" href="/"><span>◇</span> Rubik Chat</a>
        <button id="new-session" class="primary" type="button">＋ Новый чат</button>
        <nav id="sessions" aria-label="Сессии чата"></nav>
        <button id="clear-database" class="danger" type="button">Очистить историю</button>
      </aside>

      <section class="workspace" aria-labelledby="chat-title">
        <header>
          <div>
            <p class="eyebrow">ЧАТ С КОМПАКТИЗАЦИЕЙ КОНТЕКСТА</p>
            <h1 id="chat-title">Новый чат</h1>
          </div>
          <div class="session-usage">
            <strong id="session-tokens">0 токенов</strong>
            <span id="session-cost">$0.000000</span>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="empty"><span>✦</span><h2>Начните диалог</h2><p>После каждых 10 сообщений контекст автоматически сжимается.</p></div>
        </div>

        <footer>
          <span id="status" role="status">Подключение…</span>
          <form id="message-form" class="composer">
            <textarea id="message-input" rows="2" maxlength="8000000" placeholder="Напишите сообщение…" aria-label="Сообщение агенту" required></textarea>
            <button class="primary" type="submit">Отправить</button>
          </form>
        </footer>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
